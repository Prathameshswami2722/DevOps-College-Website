name: Feature request
description: Suggest an improvement to the product or delivery workflow.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: value
    attributes:
      label: Proposed improvement
      description: Explain the user or DevOps value of this change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that would make this complete.
    validations:
      required: true
