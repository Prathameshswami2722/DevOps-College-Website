name: Bug report
description: Report a reproducible problem with the website or pipeline.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Start the project..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: Copy the release value from the website footer when available.
